<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Memory Trainer</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%232563eb'/><circle cx='35' cy='35' r='10' fill='%233b82f6'/></svg>">

    <style>
        :root {
            --bg-color: #050b14;
            --panel-color: #0b1528;
            --border-color: #2663eb;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            overflow: hidden;
        }

        .container-panel {
            background-color: var(--panel-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.25);
            box-sizing: border-box;
            text-align: center;
        }

        .setup-title {
            color: #60a5fa;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hidden { display: none !important; }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #93c5fd;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: #070e1b;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .main-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }

        .time-box {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quit-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .score-txt { color: #38bdf8; }
        .best-txt { color: #fbbf24; }

        .prompt-text {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            margin: 10px 0;
            height: 24px;
        }

        #display-area {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            background-color: rgba(7, 14, 27, 0.8);
            border-radius: 8px;
            border: 1px dashed rgba(38, 99, 235, 0.4);
            position: relative;
            overflow: hidden;
        }

        #display-area .planet {
            width: 70px;
            height: 70px;
        }

        .input-order-container {
            margin-bottom: 16px;
            background-color: rgba(15, 23, 42, 0.3);
            padding: 8px;
            border-radius: 8px;
        }

        .input-order-label {
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-preview-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            align-items: center;
        }

        .preview-badge {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background-color: rgba(7, 14, 27, 0.6);
            border: 2px dashed #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            transition: all 0.2s;
            position: relative;
        }

        .preview-badge.filled {
            background-color: #0f172a;
            border: 2px solid #2563eb;
        }

        .preview-badge .planet {
            width: 30px;
            height: 30px;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.7);
        }

        .matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background-color: rgba(7, 14, 27, 0.5);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .matrix-item {
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px 5px 6px 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-sizing: border-box;
            position: relative;
            min-height: 85px;
        }

        .matrix-item:hover {
            background-color: rgba(37, 99, 235, 0.15);
            border-color: var(--border-color);
        }

        .matrix-item.disabled {
            pointer-events: none;
            opacity: 1 !important;
            filter: none !important;
        }

        .matrix.question-phase .matrix-item {
            pointer-events: none;
            cursor: default;
            background-color: rgba(30, 41, 59, 0.25);
            border-color: rgba(30, 41, 59, 0.6);
        }
        
        .matrix.question-phase .matrix-item .planet,
        .matrix.question-phase .matrix-item .label-tag {
            visibility: hidden;
        }

        .label-tag {
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
            text-transform: uppercase;
        }

        .planet {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.7), 0 0 6px rgba(255,255,255,0.1);
        }

        /* 9개 천체 디자인 */
        .p1 { 
            background: radial-gradient(circle at 50% 50%, #fff7ed, #f97316, #b91c1c); 
            box-shadow: 0 0 15px #f97316, inset -4px -4px 8px rgba(0,0,0,0.5);
            animation: sunPulse 2s infinite alternate;
        }
        @keyframes sunPulse {
            0% { box-shadow: 0 0 10px #f97316; }
            100% { box-shadow: 0 0 20px #ef4444, 0 0 8px #f97316; }
        }
        .p2 { background: radial-gradient(circle at 30% 30%, #e2e8f0, #475569); }
        .p3 { background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309); }
        .p4 { background: radial-gradient(circle at 30% 30%, #6ee7b7, #10b981, #047857, #0b1528); }
        .p5 { background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b); }
        .p6 { background: repeating-linear-gradient(45deg, #f59e0b, #b45309 8px, #78350f 16px); }
        
        .p7 { background: radial-gradient(circle at 30% 30%, #fef08a, #ca8a04); }
        .p7::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 120%; height: 13%;
            border: 2px solid rgba(234, 179, 8, 0.75); border-radius: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            box-sizing: border-box;
        }
        
        .p8 { background: radial-gradient(circle at 30% 30%, #22d3ee, #0369a1); }
        .p9 { background: radial-gradient(circle at 30% 30%, #2563eb, #1e3a8a, #0f172a); }
        
        .wrong-badge::after {
            content: '✕';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(239, 68, 68, 0.5);
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 5;
        }

        .bottom-action-container {
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .skip-btn-small {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 5px 25px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .skip-btn-small:hover:not(:disabled) {
            background-color: #334155;
            color: #ffffff;
            border-color: #475569;
        }

        .skip-btn-small:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        #game-over-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(5, 11, 20, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }

        .game-over-title { font-size: 28px; color: #f87171; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; }
        .game-over-score { font-size: 20px; margin-bottom: 30px; color: #e2e8f0; }
        
        .button-group-row { display: flex; gap: 15px; width: 80%; max-width: 300px; }
        .action-btn { 
            flex: 1; border-radius: 6px; font-size: 15px; padding: 12px 0; text-align: center; 
            font-weight: bold; border: none; cursor: pointer; color: white;
        }
        .retry-action { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .home-action { background: #334155; }
    </style>
</head>
<body>

    <!-- 1. Setup Screen -->
    <div id="setup-screen" class="container-panel">
        <h1 class="setup-title">Cosmic Memory</h1>
        
        <div class="input-group">
            <label for="count-select">Sequence Length</label>
            <select id="count-select" onchange="saveSettings()">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>
        <div class="input-group">
            <label for="time-select">Total Duration</label>
            <select id="time-select" onchange="saveSettings()">
                <option value="1" selected>1 Min</option>
                <option value="2">2 Min</option>
                <option value="3">3 Min</option>
                <option value="4">4 Min</option>
                <option value="5">5 Min</option>
                <option value="6">6 Min</option>
            </select>
        </div>
        <button class="main-btn" onclick="startGame()">START</button>
    </div>

    <!-- 2. In-Game Main Frame -->
    <div id="game-screen" class="container-panel hidden">
        <div class="status-header">
            <div class="time-box">⏳ Time Left: <span id="timer">00:00</span></div>
            <button class="quit-btn" onclick="endGame()">QUIT</button>
        </div>

        <div class="scoreboard">
            <div>✨ Score: <span id="score">0</span></div>
            <div class="best-txt">🏆 Best (<span id="game-high-time-label">1m</span>): <span id="game-high-score">0</span></div>
        </div>

        <div id="message-prompt" class="prompt-text">READY</div>
        
        <!-- Display Area -->
        <div id="display-area"></div>

        <!-- Input Status Badge Box -->
        <div class="input-order-container">
            <div class="input-order-label">YOUR INPUT ORDER</div>
            <div id="input-preview-row" class="input-preview-row"></div>
        </div>

        <!-- Selection Matrix Pad Grid -->
        <div id="matrix-grid" class="matrix"></div>

        <!-- Bottom slim SKIP button -->
        <div class="bottom-action-container">
            <button id="skip-btn" class="skip-btn-small" onclick="skipRound()" disabled>SKIP</button>
        </div>
    </div>

    <!-- 3. Game Over Overlay -->
    <div id="game-over-overlay" class="hidden">
        <div class="game-over-title">TRAINING OVER</div>
        <div class="game-over-score">Final Score: <span id="final-score">0</span> pts</div>
        <div class="button-group-row">
            <button class="action-btn retry-action" onclick="restartSameGame()">RETRY</button>
            <button class="action-btn home-action" onclick="resetToSetup()">LOBBY</button>
        </div>
    </div>

    <script>
        // --- [Core Game Engine Variable States] ---
        let planetCount = 3;  
        let totalTimeSetting = 1; 
        let totalTime = 60;   
        let gameTimer = null;
        let displayTimeoutRef = null; 
        let score = 0;
        let highScore = 0; 
        let comboCount = 0; // 연속 퍼펙트 콤보 추적 변수 추가
        
        let targetSequence = []; 
        let userSequence = [];   
        let isDisplaying = false;
        let isAnswering = false; 
        let currentRoundScore = 0;

        let audioCtx = null;

        const planetNames = {
            1: "p1", 2: "p2", 3: "p3", 4: "p4",
            5: "p5", 6: "p6", 7: "p7", 8: "p8", 9: "p9"
        };

        const planetLabels = {
            1: "SUN", 2: "MERCURY", 3: "VENUS", 4: "EARTH", 
            5: "MARS", 6: "JUPITER", 7: "SATURN", 8: "URANUS", 9: "NEPTUNE"
        };

        window.addEventListener('load', () => {
            loadSettings();
        });

        function saveSettings() {
            localStorage.setItem('pm_planetCount_v8', document.getElementById('count-select').value);
            localStorage.setItem('pm_totalTime_v8', document.getElementById('time-select').value);
        }

        function loadSettings() {
            const savedCount = localStorage.getItem('pm_planetCount_v8');
            const savedTime = localStorage.getItem('pm_totalTime_v8');
            if (savedCount) document.getElementById('count-select').value = savedCount;
            if (savedTime) document.getElementById('time-select').value = savedTime;
        }

        function loadHighScoreForTime(minutes) {
            const savedHighScore = localStorage.getItem(`pm_highScore_v8_${minutes}min`);
            return savedHighScore ? parseInt(savedHighScore) : 0;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // [요청 반영] 콤보 달성 시 극도로 강력하고 짜릿한 우르르쾅쾅 진동 패턴 추가
        function triggerHaptic(type, currentCombo = 0) {
            if ('vibrate' in navigator) {
                if (type === 'click') {
                    navigator.vibrate([80, 40, 150]); 
                } else if (type === 'clear') {
                    navigator.vibrate([100, 40, 100, 40, 250]); 
                } else if (type === 'wrong') {
                    navigator.vibrate(25); 
                } else if (type === 'combo') {
                    // 콤보가 쌓일수록 진동 강도와 연타 횟수가 기하급수적으로 늘어나는 울트라 헤비 햅틱
                    let pattern = [250, 30, 250];
                    const extraPulses = Math.min(currentCombo, 4);
                    for (let i = 0; i < extraPulses; i++) {
                        pattern.push(30, 300);
                    }
                    navigator.vibrate(pattern);
                }
            }
        }

        // [요청 반영] 연속 퍼펙트 콤보 시 고조되는 화려하고 풍성한 사운드 음향 레이어링 추가
        function playTone(type, currentCombo = 0) {
            try {
                initAudio();
                if(!audioCtx || audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'ready') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(659.25, now + 0.1); 
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'go') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(392.00, now); 
                    osc.frequency.setValueAtTime(415.30, now + 0.05); 
                    osc.frequency.setValueAtTime(440.00, now + 0.10); 
                    osc.frequency.setValueAtTime(493.88, now + 0.15); 
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'tick') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'game_over') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(440.00, now + 0.12); osc.frequency.setValueAtTime(293.66, now + 0.24);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'appear') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(349.23, now); 
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'wrong') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(180, now); osc.frequency.setValueAtTime(120, now + 0.06);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'round_clear') {
                    // 1번째 퍼펙트 (기본)
                    osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.06); osc.frequency.setValueAtTime(783.99, now + 0.12); osc.frequency.setValueAtTime(1046.50, now + 0.18);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'combo') {
                    // 콤보 증가 시 고조되는 축제 분위기의 신나는 아르페지오 멀티 신디사이저 사운드
                    const pitchMultiplier = 1 + (currentCombo * 0.08); 
                    const base = 523.25 * pitchMultiplier; // 콤보 누적에 따라 기본 톤 전체 상승
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(base, now);
                    osc.frequency.setValueAtTime(base * 1.25, now + 0.04);
                    osc.frequency.setValueAtTime(base * 1.50, now + 0.08);
                    osc.frequency.setValueAtTime(base * 2.00, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);

                    // 화려함과 에너지를 증폭하기 위한 서브 트라이앵글 화음 오실레이터 동시 레이어링
                    const subOsc = audioCtx.createOscillator();
                    const subGain = audioCtx.createGain();
                    subOsc.type = 'triangle';
                    subOsc.frequency.setValueAtTime(base * 1.5, now);
                    subOsc.frequency.setValueAtTime(base * 2.5, now + 0.06);
                    subOsc.frequency.setValueAtTime(base * 3.0, now + 0.12);
                    subOsc.connect(subGain); subGain.connect(audioCtx.destination);
                    subGain.gain.setValueAtTime(0.1, now);
                    subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    subOsc.start(now); subOsc.stop(now + 0.35);
                }
            } catch(e) { console.log(e); }
        }

        function startGame() {
            initAudio(); saveSettings();
            planetCount = parseInt(document.getElementById('count-select').value);
            totalTimeSetting = parseInt(document.getElementById('time-select').value);
            totalTime = totalTimeSetting * 60;
            executeCoreGameSetup();
        }

        function restartSameGame() {
            totalTime = totalTimeSetting * 60;
            executeCoreGameSetup();
        }

        function executeCoreGameSetup() {
            score = 0;
            comboCount = 0; // 게임 시작 시 초기화
            highScore = loadHighScoreForTime(totalTimeSetting); 
            
            document.getElementById('score').innerText = score;
            document.getElementById('game-high-time-label').innerText = `${totalTimeSetting}m`;
            document.getElementById('game-high-score').innerText = highScore;
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-over-overlay').classList.add('hidden'); 

            document.getElementById('skip-btn').disabled = true;

            runStartCountdownSequence();
        }

        function runStartCountdownSequence() {
            isDisplaying = true; isAnswering = false;
            
            buildInputBadges(); 
            renderGridMatrix();
            
            document.getElementById('matrix-grid').classList.add('question-phase');
            
            const prompt = document.getElementById('message-prompt');
            document.getElementById('display-area').innerHTML = ''; 

            prompt.style.color = "#fbbf24"; 
            prompt.innerText = "READY";
            playTone('ready'); 

            setTimeout(() => {
                if (totalTime <= 0) return; 
                
                prompt.style.color = "#4ade80"; 
                prompt.innerText = "GO!!";
                playTone('go'); 
                
                startCountdown(); 

                setTimeout(() => {
                    nextRound(true); 
                }, 1000); 
            }, 1000);
        }

        function startCountdown() {
            clearInterval(gameTimer); updateTimerDisplay();
            gameTimer = setInterval(() => {
                totalTime--; updateTimerDisplay();
                if (totalTime <= 5 && totalTime > 0) playTone('tick');
                if (totalTime <= 0) endGame();
            }, 1000);
        }

        function updateTimerDisplay() {
            const min = String(Math.floor(totalTime / 60)).padStart(2, '0');
            const sec = String(totalTime % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${min}:${sec}`;
        }

        function buildInputBadges() {
            const previewRow = document.getElementById('input-preview-row');
            previewRow.innerHTML = '';
            for (let i = 0; i < planetCount; i++) {
                const badge = document.createElement('div');
                badge.className = 'preview-badge'; badge.id = `preview-badge-${i}`;
                badge.innerText = '';
                previewRow.appendChild(badge);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderGridMatrix() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            
            let items = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            shuffleArray(items); 
            
            items.forEach(id => {
                const itemDiv = document.createElement('div');
                itemDiv.id = `matrix-item-${id}`; itemDiv.className = 'matrix-item';
                itemDiv.onclick = () => selectPlanet(id);
                
                grid.appendChild(itemDiv);
                itemDiv.innerHTML = `
                    <div class="planet ${planetNames[id]}"></div>
                    <div class="label-tag">${planetLabels[id]}</div>
                `;
            });
        }

        function generateSequence(count) {
            let seq = [];
            for (let i = 0; i < count; i++) {
                let randId;
                do {
                    randId = Math.floor(Math.random() * 9) + 1;
                } while (i > 0 && seq[i - 1] === randId);
                seq.push(randId);
            }
            return seq;
        }

        function nextRound(isFirstRound = false) {
            if (totalTime <= 0) return;
            
            isDisplaying = true; isAnswering = false;
            userSequence = []; currentRoundScore = 0;

            if (!isFirstRound) {
                buildInputBadges();
            }
            
            document.getElementById('matrix-grid').classList.add('question-phase');
            document.getElementById('skip-btn').disabled = true; 
            
            const prompt = document.getElementById('message-prompt');
            prompt.style.color = "#38bdf8";
            prompt.innerText = "Watch the sequence!";
            
            targetSequence = generateSequence(planetCount);

            const displayArea = document.getElementById('display-area');
            displayArea.innerHTML = ''; 

            let step = 0;
            clearTimeout(displayTimeoutRef);

            function flashPlanet() {
                if (step < targetSequence.length) {
                    const planetId = targetSequence[step];
                    const randomOffset = Math.floor(Math.random() * 161) - 80;
                    
                    displayArea.innerHTML = `<div class="planet ${planetNames[planetId]}" style="transform: translateX(${randomOffset}px) scale(1.1)"></div>`;
                    playTone('appear');
                    step++;

                    displayTimeoutRef = setTimeout(() => {
                        displayArea.innerHTML = ''; 
                        displayTimeoutRef = setTimeout(flashPlanet, 250); 
                    }, 850);
                } else {
                    isDisplaying = false; isAnswering = true;
                    
                    renderGridMatrix();
                    document.getElementById('matrix-grid').classList.remove('question-phase');
                    
                    const items = document.querySelectorAll('.matrix-item');
                    items.forEach(item => item.classList.remove('disabled'));
                    
                    document.getElementById('skip-btn').disabled = false;
                    prompt.style.color = "#4ade80";
                    prompt.innerText = "Select in the correct order!";
                }
            }

            flashPlanet();
        }

        function selectPlanet(id) {
            if (!isAnswering || userSequence.length >= planetCount) return;

            const currentIdx = userSequence.length;
            userSequence.push(id);
            const correctId = targetSequence[currentIdx];

            const badge = document.getElementById(`preview-badge-${currentIdx}`);
            
            if (id !== correctId) {
                comboCount = 0; // 한 번이라도 틀리면 실시간으로 콤보 즉시 리셋
                if (badge) {
                    badge.classList.add('wrong-badge');
                    badge.innerHTML = `<div class="planet ${planetNames[id]}"></div>`;
                }
                playTone('wrong'); 
                triggerHaptic('wrong'); 
            } else {
                score++; currentRoundScore++;
                document.getElementById('score').innerText = score;
                if (badge) {
                    badge.classList.add('filled');
                    badge.innerHTML = `<div class="planet ${planetNames[id]}"></div>`;
                }
                playTone('click'); 
                triggerHaptic('click'); 
            }
            
            checkSequenceCompletion();
        }

        function skipRound() {
            if (!isAnswering) return;
            isAnswering = false;
            comboCount = 0; // 스킵 시 콤보 리셋
            document.getElementById('skip-btn').disabled = true;

            const items = document.querySelectorAll('.matrix-item');
            items.forEach(item => item.classList.add('disabled'));

            document.getElementById('message-prompt').style.color = "#f87171";
            document.getElementById('message-prompt').innerText = "Round Skipped";
            playTone('wrong');

            for (let i = 0; i < planetCount; i++) {
                const correctId = targetSequence[i];
                const badge = document.getElementById(`preview-badge-${i}`);
                if (badge) {
                    badge.classList.remove('wrong-badge');
                    badge.classList.add('filled');
                    badge.innerHTML = `<div class="planet ${planetNames[correctId]}" style="opacity: 0.85;"></div>`;
                }
            }

            setTimeout(() => { nextRound(); }, 1500);
        }

        function checkSequenceCompletion() {
            if (userSequence.length === planetCount) {
                isAnswering = false;
                document.getElementById('skip-btn').disabled = true;
                
                const items = document.querySelectorAll('.matrix-item');
                items.forEach(item => item.classList.add('disabled')); 

                const isAllCorrect = (currentRoundScore === planetCount);
                if (isAllCorrect) {
                    // [요청 반영] 콤보 스코어 배율 계산 공식 시스템 정교화 구축
                    // 첫 퍼펙트: (행성수*2)*1배 = 6점 (기본 클릭 3점 누적 상태이므로 추가 보너스로 3점 더해줌)
                    // 콤보 +1: (행성수*2)*2배 = 12점 (기본 클릭 3점 누적 상태이므로 추가 보너스로 9점 더해줌)
                    // 콤보 +2: (행성수*2)*3배 = 18점 (기본 클릭 3점 누적 상태이므로 추가 보너스로 15점 더해줌)
                    const roundTotalScore = (planetCount * 2) * (1 + comboCount);
                    const netBonusToAdd = roundTotalScore - planetCount; 
                    
                    score += netBonusToAdd;
                    document.getElementById('score').innerText = score;

                    setTimeout(() => {
                        const promptEl = document.getElementById('message-prompt');
                        if (comboCount > 0) {
                            // 콤보 모드 돌입 (+1 콤보 이상일 때) -> 특별 연출, 화려한 사운드, 메가 햅틱
                            promptEl.style.color = "#f43f5e"; // 더욱 강렬한 로즈 핑크 테마 색상 변경
                            promptEl.innerText = `🔥 COMBO +${comboCount}! (+${roundTotalScore})`;
                            playTone('combo', comboCount); 
                            triggerHaptic('combo', comboCount); 
                        } else {
                            // 첫 번째 퍼펙트 달성 시
                            promptEl.style.color = "#fbbf24";
                            promptEl.innerText = `✨ PERFECT! (+${roundTotalScore})`;
                            playTone('round_clear'); 
                            triggerHaptic('clear'); 
                        }
                        comboCount++; // 다음 라운드를 위해 콤보 스택 누적 증가
                    }, 150);
                } else {
                    comboCount = 0; // 퍼펙트 실패 시 콤보 완전 파괴 및 초기화
                }

                if (score > highScore) {
                    highScore = score;
                    document.getElementById('game-high-score').innerText = highScore;
                }
                setTimeout(() => { nextRound(); }, 1400); 
            }
        }

        function endGame() {
            clearInterval(gameTimer); clearTimeout(displayTimeoutRef);
            isAnswering = false; isDisplaying = false;
            
            if (score > highScore) highScore = score;
            localStorage.setItem(`pm_highScore_v8_${totalTimeSetting}min`, highScore);

            playTone('game_over'); 
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-overlay').classList.remove('hidden');
        }

        function resetToSetup() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-over-overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
